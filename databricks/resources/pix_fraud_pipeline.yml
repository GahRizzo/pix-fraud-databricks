resources:
  jobs:
    pix_fraud_daily_pipeline:
      name: pix_fraud_daily_pipeline

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: "UNPAUSED"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/*.whl

      tasks:
        - task_key: bronze
          environment_key: default
          spark_python_task:
            python_file: ../../jobs/bronze_job.py
            parameters:
              - "--source-path"
              - "/Volumes/workspace/pix_fraud_dev/pix_ingestion/input/"
              - "--bronze-table"
              - "workspace.pix_fraud_dev.bronze_pix_transacoes"
              - "--control-table"
              - "workspace.pix_fraud_dev.ingestion_control"

        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: default
          spark_python_task:
            python_file: ../../jobs/silver_job.py
            parameters:
              - "--bronze-table"
              - "workspace.pix_fraud_dev.bronze_pix_transacoes"
              - "--silver-table"
              - "workspace.pix_fraud_dev.silver_pix_transacoes"
              - "--threshold-table"
              - "workspace.pix_fraud_dev.risk_thresholds"
              - "--watermark-table"
              - "workspace.pix_fraud_dev.layer_watermarks"

        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          spark_python_task:
            python_file: ../../jobs/gold_job.py
            parameters:
              - "--silver-table"
              - "workspace.pix_fraud_dev.silver_pix_transacoes"

              - "--gold-risk-table"
              - "workspace.pix_fraud_dev.gold_eficacia_risco_pix"

              - "--gold-operational-table"
              - "workspace.pix_fraud_dev.gold_operacional"

              - "--gold-alerts-table"
              - "workspace.pix_fraud_dev.gold_alertas_pix"

              - "--watermark-table"
              - "workspace.pix_fraud_dev.layer_watermarks"

              - "--alert-score"
              - "3"