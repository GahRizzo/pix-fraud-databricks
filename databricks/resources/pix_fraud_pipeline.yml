resources:
  jobs:
    pix_fraud_daily_pipeline:
      name: pix_fraud_daily_pipeline

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: "UNPAUSED"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

      tasks:
        - task_key: bronze
          environment_key: default
          spark_python_task:
            python_file: ../../jobs/bronze_job.py
            parameters:
              - "--source-path"
              - "/Volumes/workspace/pix_fraud_dev/pix_ingestion/input/"
              - "--bronze-table"
              - "workspace.pix_fraud_dev.bronze_pix_transacoes"
              - "--control-table"
              - "workspace.pix_fraud_dev.ingestion_control"
          libraries:
            - whl: ../../dist/*.whl

        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: default
          spark_python_task:
            python_file: ../../jobs/silver_job.py
          libraries:
            - whl: ../../dist/*.whl

        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          spark_python_task:
            python_file: ../../jobs/gold_job.py
          libraries:
            - whl: ../../dist/*.whl